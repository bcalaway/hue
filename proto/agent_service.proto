syntax = "proto3";

package hue;

// Service-to-service contract between the hub and each site's local agent
// (ADR-0020 in nyc_pa_aws_gitops). Internal-only on the shared
// `home-platform` Docker network -- never routed through Traefik, never
// exposed to the internet. One agent instance per site (NYC/Rambles); the
// hub picks which agent to call based on which site's state it needs.
service AgentService {
  // MVP is read-only (docs/roadmap.md Milestone 12): current state for this
  // site's lights, scenes, and automations, pulled live from the local Hue
  // bridge on every call -- no caching/sync on either side yet.
  rpc GetState(GetStateRequest) returns (GetStateResponse);

  // Control RPCs (Milestone 14) -- direct passthrough to the bridge's own
  // CLIP v2 PUT semantics, no state held on either the agent or hub side.
  // Both are idempotent from the caller's perspective (setting the same
  // on/off value twice, or recalling the same scene twice, is harmless).
  rpc SetLightState(SetLightStateRequest) returns (SetLightStateResponse);
  rpc ActivateScene(ActivateSceneRequest) returns (ActivateSceneResponse);

  // Set one light's brightness (the UI's per-light dimmer slider). The
  // agent sends CLIP v2 `dimming.brightness` AND `on.on=true` in the same
  // PUT -- dragging a slider up from a low value is expected to light a
  // light that was off, the same as the Hue app's own slider does.
  // Idempotent.
  rpc SetLightBrightness(SetLightBrightnessRequest) returns (SetLightBrightnessResponse);

  // Turns every light in a room on/off in one bridge call, via CLIP v2's
  // grouped_light resource (Hue auto-creates exactly one per room) --
  // that's how Hue's own app implements a room on/off control, rather than
  // issuing one PUT per light.
  rpc SetGroupedLightState(SetGroupedLightStateRequest) returns (SetGroupedLightStateResponse);
}

message GetStateRequest {}

message SetLightStateRequest {
  string light_id = 1;
  bool on = 2;
}

message SetLightStateResponse {
  bool ok = 1;
  string error = 2;  // empty on success
}

message SetLightBrightnessRequest {
  string light_id = 1;
  // 1-100, CLIP v2's native `dimming.brightness` percentage. The hub
  // clamps to this range before sending -- CLIP v2 rejects 0 (a light at
  // "0%" is off, which is the on/off toggle's job, not the slider's).
  double brightness = 2;
}

message SetLightBrightnessResponse {
  bool ok = 1;
  string error = 2;  // empty on success
}

message ActivateSceneRequest {
  string scene_id = 1;
  // Crossfade duration in milliseconds -- CLIP v2's own recall.duration
  // field. 0 (the default) omits it from the bridge PUT entirely, which
  // means "use the bridge's own default transition" -- the existing
  // click-to-activate behavior. Animations (Milestone 14) pass a real
  // value so scene alternation fades rather than cuts.
  int32 duration_ms = 2;
}

message ActivateSceneResponse {
  bool ok = 1;
  string error = 2;  // empty on success
}

message SetGroupedLightStateRequest {
  string grouped_light_id = 1;
  bool on = 2;
}

message SetGroupedLightStateResponse {
  bool ok = 1;
  string error = 2;  // empty on success
}

message Light {
  string id = 1;         // Hue CLIP v2 resource UUID
  string name = 2;
  bool on = 3;
  double brightness = 4;  // 0-100 -- CLIP v2's native percentage (confirmed
                           // live against the real NYC bridge; the legacy
                           // CLIP v1 API used a 0-254 byte range instead).
                           // Meaningless when dimmable is false -- see below.
  string color_hex = 5;   // "#rrggbb", computed from the bridge's CIE xy
                           // color (or color_temperature mirek for
                           // tunable-white-only lights) -- empty for
                           // dimmable/on-off-only lights with neither.
                           // Computed agent-side (the only place that
                           // understands Hue-specific color science) so the
                           // hub can just render it directly.
  bool dimmable = 6;      // Whether CLIP v2's light resource has a
                           // "dimming" service at all -- confirmed live
                           // that Hue smart plugs (on/off only, no
                           // brightness) simply omit it, which without this
                           // flag left the hub defaulting brightness to 0
                           // and showing a real "on" plug as "0%".
}

message Scene {
  string id = 1;
  string name = 2;
  bool active = 3;        // from CLIP v2's own scene.status.active field --
                           // confirmed live that Hue does track this,
                           // unlike CLIP v1's scenes endpoint
  string color_hex = 4;   // representative swatch color, from the scene's
                           // own palette (or first action's color/color
                           // temperature if the palette is empty) -- same
                           // computation as Light.color_hex
}

message Room {
  string id = 1;
  string name = 2;
  repeated Light lights = 3;
  // Only scenes whose own CLIP v2 group is THIS room (group.rtype ==
  // "room") -- confirmed live that a scene's group can also be a "zone"
  // (a cross-room grouping), which this agent deliberately doesn't surface
  // since there's no room card to attach it to yet.
  repeated Scene scenes = 4;
  // CLIP v2 room.services[] entry with rtype "grouped_light" -- the
  // resource id SetGroupedLightState actually operates on. Empty in the
  // (currently theoretical) case a room somehow has none.
  string grouped_light_id = 5;
}

message Automation {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  string status = 4;      // Hue's own behavior_instance.status string
                           // (e.g. "running", "disabled") passed through
                           // as-is rather than mapped to an enum we'd have
                           // to keep in sync with every status Hue can emit
  // The behavior_instance's own "configuration" object, passed through as
  // raw JSON text rather than modeled field-by-field -- its shape is
  // entirely defined by whichever behavior_script the automation is an
  // instance of (Hue ships dozens: wake-up, go-to-sleep, motion-triggered,
  // etc.), each with its own configuration schema Hue doesn't publish.
  // Showing the raw definition is far cheaper than maintaining a typed
  // model per script type for a read-only "what does this do" view.
  string configuration_json = 5;
}

message GetStateResponse {
  string site = 1;         // "nyc" or "rambles" -- self-describing for
                            // logging/debugging, even though the caller
                            // already knows which agent it queried
  repeated Automation automations = 4;

  // 2 and 3 used to be the flat `lights`/`scenes` lists this response
  // carried before rooms existed. Reserved rather than reused -- during
  // the version-skew window while an old agent binary is still running
  // on a NUC (agent deploys are manual, unlike the hub's auto-deploy),
  // reusing these numbers for the new, differently-typed `rooms`/
  // `unassigned_lights` fields below caused real live data corruption:
  // confirmed 2026-08-21, the hub silently parsed the old agent's Light
  // messages (field 2) as Room messages, since both start with two
  // string fields (id, name) that happen to decode compatibly -- every
  // "room" came back named after an individual light, with zero lights
  // inside, no error thrown anywhere.
  reserved 2, 3;
  reserved "lights", "scenes";

  repeated Room rooms = 5;
  // Lights whose device isn't a child of any CLIP v2 room -- confirmed
  // live that a real bridge can have lights with no room at all (16 lights
  // across only 4 rooms on the NYC bridge). Surfaced separately rather than
  // silently dropped.
  repeated Light unassigned_lights = 6;
}
