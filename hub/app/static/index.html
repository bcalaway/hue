<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hue</title>
    <style>
      body {
        max-width: 640px;
        margin: 3rem auto;
        padding: 0 1.5rem;
        font-family: system-ui, sans-serif;
        color: #1a1a1a;
      }
      h2 {
        margin-top: 2.5rem;
        text-transform: capitalize;
      }
      h3 {
        margin-top: 1.5rem;
        border-bottom: 1px solid #ddd;
        padding-bottom: 0.25rem;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        padding: 0.35rem 0;
        display: flex;
        justify-content: space-between;
      }
      .on {
        color: #1a7f1a;
      }
      .off {
        color: #999;
      }
      .unavailable {
        color: #b00;
      }
    </style>
  </head>
  <body>
    <h1>Hue</h1>
    <div id="sites">Loading...</div>

    <script>
      // Working example, not a requirement -- MVP is read-only (see
      // docs/roadmap.md's Milestone 12 in nyc_pa_aws_gitops). Replace with
      // real interactivity (kicking off scenes/automations) in a later
      // phase.
      function renderList(items, render) {
        const ul = document.createElement("ul");
        for (const item of items) {
          const li = document.createElement("li");
          li.innerHTML = render(item);
          ul.appendChild(li);
        }
        return ul;
      }

      function renderSite(name, data) {
        const section = document.createElement("section");

        const heading = document.createElement("h2");
        heading.textContent = name;
        section.appendChild(heading);

        if (!data.available) {
          const status = document.createElement("p");
          status.textContent = "Agent unreachable -- no live data.";
          status.className = "unavailable";
          section.appendChild(status);
          return section;
        }

        section.appendChild(Object.assign(document.createElement("h3"), { textContent: "Lights" }));
        section.appendChild(
          renderList(
            data.lights,
            (light) =>
              `<span>${light.name}</span><span class="${light.on ? "on" : "off"}">${
                light.on ? `on (${Math.round(light.brightness)}%)` : "off"
              }</span>`
          )
        );

        section.appendChild(Object.assign(document.createElement("h3"), { textContent: "Scenes" }));
        section.appendChild(
          renderList(
            data.scenes,
            (scene) =>
              `<span>${scene.name}</span><span class="${scene.active ? "on" : "off"}">${
                scene.active ? "active" : ""
              }</span>`
          )
        );

        section.appendChild(Object.assign(document.createElement("h3"), { textContent: "Automations" }));
        section.appendChild(
          renderList(
            data.automations,
            (automation) =>
              `<span>${automation.name}</span><span class="${
                automation.enabled ? "on" : "off"
              }">${automation.status}</span>`
          )
        );

        return section;
      }

      fetch("/api/state")
        .then((r) => r.json())
        .then((data) => {
          const sitesEl = document.getElementById("sites");
          sitesEl.innerHTML = "";
          for (const [name, site] of Object.entries(data.sites)) {
            sitesEl.appendChild(renderSite(name, site));
          }
        })
        .catch(() => {
          document.getElementById("sites").textContent = "Failed to load state.";
        });
    </script>
  </body>
</html>
