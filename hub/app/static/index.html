<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hue</title>
    <style>
      body {
        max-width: 640px;
        margin: 3rem auto;
        padding: 0 1.5rem;
        font-family: system-ui, sans-serif;
        color: #1a1a1a;
      }
      h2 {
        margin-top: 2rem;
        border-bottom: 1px solid #ddd;
        padding-bottom: 0.25rem;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        padding: 0.35rem 0;
        display: flex;
        justify-content: space-between;
      }
      .on {
        color: #1a7f1a;
      }
      .off {
        color: #999;
      }
      .unavailable {
        color: #b00;
      }
    </style>
  </head>
  <body>
    <h1>Hue</h1>
    <p id="status">Loading...</p>

    <h2>Lights</h2>
    <ul id="lights"></ul>

    <h2>Scenes</h2>
    <ul id="scenes"></ul>

    <h2>Automations</h2>
    <ul id="automations"></ul>

    <script>
      // Working example, not a requirement -- MVP is read-only (see
      // docs/roadmap.md's Milestone 12 in nyc_pa_aws_gitops). Replace with
      // real interactivity (kicking off scenes/automations) in a later
      // phase.
      fetch("/api/state")
        .then((r) => r.json())
        .then((data) => {
          const status = document.getElementById("status");
          if (!data.available) {
            status.textContent = "Agent unreachable -- no live data.";
            status.className = "unavailable";
            return;
          }
          status.textContent = `Site: ${data.site}`;

          const lights = document.getElementById("lights");
          for (const light of data.lights) {
            const li = document.createElement("li");
            li.innerHTML = `<span>${light.name}</span><span class="${light.on ? "on" : "off"}">${
              light.on ? `on (${Math.round(light.brightness)}%)` : "off"
            }</span>`;
            lights.appendChild(li);
          }

          const scenes = document.getElementById("scenes");
          for (const scene of data.scenes) {
            const li = document.createElement("li");
            li.innerHTML = `<span>${scene.name}</span><span class="${scene.active ? "on" : "off"}">${
              scene.active ? "active" : ""
            }</span>`;
            scenes.appendChild(li);
          }

          const automations = document.getElementById("automations");
          for (const automation of data.automations) {
            const li = document.createElement("li");
            li.innerHTML = `<span>${automation.name}</span><span class="${
              automation.enabled ? "on" : "off"
            }">${automation.status}</span>`;
            automations.appendChild(li);
          }
        })
        .catch(() => {
          document.getElementById("status").textContent = "Failed to load state.";
        });
    </script>
  </body>
</html>
