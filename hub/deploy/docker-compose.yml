# Deploy-time Compose fragment (docs/app-platform.md in nyc_pa_aws_gitops).
# app-deploy.yml stages this file to the hub as-is and runs it there with
# `docker compose pull && docker compose up -d` -- the image tag, .env
# file, and `home-platform` network are all provided at deploy time.

services:
  app:
    image: 147856894209.dkr.ecr.us-east-1.amazonaws.com/hue:latest
    container_name: hue
    restart: unless-stopped
    environment:
      # Not secrets -- set directly here rather than round-tripping through
      # SSM/.env like the real credentials below.
      APP_NAME: hue
      # One agent per site, both reachable from the hub over the existing
      # WireGuard mesh (10.0.3.0/24 <-> 10.0.1.0/24 and <-> 10.0.2.0/24) --
      # see ADR-0020.
      AGENT_HOST_NYC: "10.0.1.34"
      AGENT_HOST_RAMBLES: "10.0.2.10"
      AGENT_PORT: "9090"
      # Public WAN egress IP per site -- lets the UI auto-select the site
      # dropdown from which network the browser is on (the hub sees the
      # site's NAT egress IP in X-Forwarded-For). Best-effort: these are
      # residential dynamic IPs and will drift -- update here when they do
      # (open /api/detected-site to see the IP the hub currently sees).
      # Rambles on Starlink failover is CGNAT with no stable IP; that case
      # just falls back to manual selection. Measured 2026-08-27.
      SITE_WAN_IP_NYC: "173.68.62.107"
      SITE_WAN_IP_RAMBLES: "204.186.165.69"
    env_file:
      - .env
    networks:
      - home-platform
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hue.rule=Host(`hue.billandjessie.com`)"
      - "traefik.http.routers.hue.entrypoints=websecure"
      - "traefik.http.routers.hue.tls.certresolver=route53"
      - "traefik.http.routers.hue.middlewares=hsts@docker"
      - "traefik.http.services.hue.loadbalancer.server.port=8000"

networks:
  home-platform:
    external: true
